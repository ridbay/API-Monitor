{{/* Single-node dev datastores. See values.yaml for why these aren't for OpenShift/production. */}}
{{- $fullname := include "api-monitor.fullname" . }}
{{- if .Values.postgresql.deploy }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}-postgres
  labels:
    {{- include "api-monitor.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ $fullname }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "api-monitor.selector" (dict "ctx" $ "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "api-monitor.selector" (dict "ctx" $ "component" "postgres") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: {{ .Values.postgresql.image }}
          env:
            - { name: POSTGRES_DB, value: {{ .Values.postgresql.database | quote }} }
            - { name: POSTGRES_USER, value: {{ .Values.postgresql.username | quote }} }
            - { name: POSTGRES_PASSWORD, value: {{ .Values.postgresql.password | quote }} }
            # Subdirectory: the volume root may contain lost+found.
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports:
            - { name: postgres, containerPort: 5432 }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", {{ .Values.postgresql.username | quote }}] }
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgresql.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-postgres
  labels:
    {{- include "api-monitor.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "api-monitor.selector" (dict "ctx" $ "component" "postgres") | nindent 4 }}
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
{{- end }}
{{- if .Values.redis.deploy }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-redis
  labels:
    {{- include "api-monitor.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "api-monitor.selector" (dict "ctx" $ "component" "redis") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "api-monitor.selector" (dict "ctx" $ "component" "redis") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          # Cache only; nothing worth persisting.
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - { name: redis, containerPort: 6379 }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-redis
  labels:
    {{- include "api-monitor.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "api-monitor.selector" (dict "ctx" $ "component" "redis") | nindent 4 }}
  ports:
    - { name: redis, port: 6379, targetPort: redis }
{{- end }}
{{- if .Values.kafka.deploy }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}-kafka
  labels:
    {{- include "api-monitor.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka
spec:
  serviceName: {{ $fullname }}-kafka
  replicas: 1
  selector:
    matchLabels:
      {{- include "api-monitor.selector" (dict "ctx" $ "component" "kafka") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "api-monitor.selector" (dict "ctx" $ "component" "kafka") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: kafka
          image: {{ .Values.kafka.image }}
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://{{ $fullname }}-kafka:9092" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "PLAINTEXT" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false" }
            - { name: KAFKA_LOG_DIRS, value: "/var/lib/kafka/data" }
          ports:
            - { name: kafka, containerPort: 9092 }
          readinessProbe:
            tcpSocket: { port: kafka }
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/kafka/data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.kafka.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.kafka.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-kafka
  labels:
    {{- include "api-monitor.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "api-monitor.selector" (dict "ctx" $ "component" "kafka") | nindent 4 }}
  ports:
    - { name: kafka, port: 9092, targetPort: kafka }
{{- end }}
