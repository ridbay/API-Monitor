{{- if not .Values.secrets.existingSecret }}
{{- $db := "" }}
{{- if .Values.postgresql.deploy }}
{{- $db = printf "postgres://%s:%s@%s-postgres:5432/%s" .Values.postgresql.username .Values.postgresql.password (include "api-monitor.fullname" .) .Values.postgresql.database }}
{{- else }}
{{- $db = required "externalDatabase.url (or secrets.existingSecret) is required when postgresql.deploy is false" .Values.externalDatabase.url }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "api-monitor.fullname" . }}-secrets
  labels:
    {{- include "api-monitor.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ $db | quote }}
  SERVICENOW_USER: {{ .Values.secrets.serviceNowUser | quote }}
  SERVICENOW_PASSWORD: {{ .Values.secrets.serviceNowPassword | quote }}
  GEMINI_API_KEY: {{ .Values.secrets.geminiApiKey | quote }}
  KAFKA_SASL_USERNAME: {{ .Values.kafka.saslUsername | quote }}
  KAFKA_SASL_PASSWORD: {{ .Values.kafka.saslPassword | quote }}
{{- end }}
