{{- define "api-monitor.nginxConf" -}}
server {
    listen {{ .Values.frontend.port }};
    server_name _;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        client_max_body_size 20m;
        proxy_pass http://{{ include "api-monitor.fullname" . }}-api:{{ .Values.api.port }};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Load-test runs stream over SSE; don't buffer or time them out early.
        proxy_buffering off;
        proxy_read_timeout 15m;
    }
}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "api-monitor.fullname" . }}-nginx
  labels:
    {{- include "api-monitor.labels" . | nindent 4 }}
data:
  default.conf: |
    {{- include "api-monitor.nginxConf" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "api-monitor.fullname" . }}-frontend
  labels:
    {{- include "api-monitor.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      {{- include "api-monitor.selector" (dict "ctx" $ "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "api-monitor.selector" (dict "ctx" $ "component" "frontend") | nindent 8 }}
      annotations:
        checksum/nginx: {{ include "api-monitor.nginxConf" . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- include "api-monitor.podCommon" . | nindent 6 }}
      containers:
        - name: frontend
          image: {{ include "api-monitor.frontendImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: nginx-conf
          configMap:
            name: {{ include "api-monitor.fullname" . }}-nginx
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "api-monitor.fullname" . }}-frontend
  labels:
    {{- include "api-monitor.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  selector:
    {{- include "api-monitor.selector" (dict "ctx" $ "component" "frontend") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
