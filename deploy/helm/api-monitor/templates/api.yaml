{{- if and (gt (int .Values.api.replicas) 1) (not .Values.scheduler.separate) }}
{{- fail "api.replicas > 1 needs scheduler.separate: true, otherwise every replica runs the health-check scheduler" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "api-monitor.fullname" . }}-api
  labels:
    {{- include "api-monitor.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "api-monitor.selector" (dict "ctx" $ "component" "api") | nindent 6 }}
  template:
    {{- include "api-monitor.backendPod" (dict "ctx" $ "component" "api" "scheduler" (ternary "false" "true" .Values.scheduler.separate) "resources" .Values.api.resources) | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "api-monitor.fullname" . }}-api
  labels:
    {{- include "api-monitor.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    {{- include "api-monitor.selector" (dict "ctx" $ "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
