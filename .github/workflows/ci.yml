name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/api_monitoring_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck:test
      - run: npm test
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - run: helm lint deploy/helm/api-monitor
      - run: helm lint deploy/helm/api-monitor -f deploy/helm/api-monitor/values-openshift.yaml --set secrets.existingSecret=ci
      - name: Render and validate manifests
        run: |
          helm template ci deploy/helm/api-monitor > default.yaml
          helm template ci deploy/helm/api-monitor -f deploy/helm/api-monitor/values-openshift.yaml --set secrets.existingSecret=ci > openshift.yaml
          docker run --rm -v "$PWD":/m ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -skip Route -kubernetes-version 1.30.0 /m/default.yaml /m/openshift.yaml
